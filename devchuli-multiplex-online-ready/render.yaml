services:
  - type: web
    name: devchuli-multiplex
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TICKET_URL
        value: https://www.inicinemas.com
      - key: VAT_RATE
        value: "13"
    disk:
      name: devchuli-data
      mountPath: /data
      sizeGB: 1
